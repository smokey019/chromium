<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Website blocked</title>
  <link rel="stylesheet" href="blocked.css">
  <script type="module" src="blocked.js"></script>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      <path class="cross" d="M8.5 8.5l7 7m0-7-7 7"/>
    </svg>
    <h1 id="title">This website is blocked</h1>
    <p id="reason" class="reason"></p>
    <p id="url" class="url"></p>
    <div id="details" class="details" hidden>
      <div><span class="key">List</span><span id="list"></span></div>
      <div><span class="key">Filter</span><code id="filter"></code></div>
    </div>
    <div class="buttons" id="buttons">
      <button id="back" class="primary">Go back</button>
      <button id="session">Allow for this session</button>
      <button id="always">Allow always</button>
      <button id="block">Always block</button>
    </div>
    <p id="status" class="status" hidden></p>
    <p class="help">
      The ad blocker blocked this page because a filter list says it is
      harmful or unwanted. If you trust the site you can open it anyway. You
      can change these choices later in Settings &gt; Ad blocker.
    </p>
  </main>
</body>
</html>
